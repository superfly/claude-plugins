name: Release sprite-handoff

on:
  push:
    tags:
      - 'sprite-handoff-v*'

defaults:
  run:
    working-directory: sprite-handoff

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: sprite-handoff/go.sum

      - name: Build binaries for all platforms
        run: make build-all

      - name: Commit binaries to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add -f bin/
          git commit -m "Build sprite-handoff binaries for ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push origin main

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#sprite-handoff-}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: sprite-handoff ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            sprite-handoff/bin/sprite-handoff-darwin-amd64
            sprite-handoff/bin/sprite-handoff-darwin-arm64
            sprite-handoff/bin/sprite-handoff-linux-amd64
            sprite-handoff/bin/sprite-handoff-linux-arm64
